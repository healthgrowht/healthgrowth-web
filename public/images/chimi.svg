<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none" role="img" aria-label="Chimi — Asistente digital de Health Growth">
  <defs>
    <radialGradient id="chimEyeL" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="55%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </radialGradient>
    <radialGradient id="chimEyeR" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="55%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </radialGradient>
    <radialGradient id="chimBody" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1a2845"/>
      <stop offset="100%" stop-color="#0c1525"/>
    </radialGradient>
    <radialGradient id="chimAmbient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient glow -->
  <ellipse cx="100" cy="145" rx="72" ry="58" fill="url(#chimAmbient)"/>

  <!-- Body -->
  <ellipse cx="100" cy="182" rx="47" ry="37" fill="url(#chimBody)"/>
  <!-- Chest lighter -->
  <ellipse cx="100" cy="178" rx="27" ry="22" fill="#161f33"/>

  <!-- Head -->
  <ellipse cx="100" cy="110" rx="61" ry="57" fill="url(#chimBody)"/>

  <!-- Left ear outer -->
  <polygon points="44,76 35,31 71,60" fill="#0c1525"/>
  <!-- Left ear inner -->
  <polygon points="47,73 42,38 67,59" fill="#1e2e48"/>
  <!-- Right ear outer -->
  <polygon points="156,76 165,31 129,60" fill="#0c1525"/>
  <!-- Right ear inner -->
  <polygon points="153,73 158,38 133,59" fill="#1e2e48"/>

  <!-- Eye glow halo left -->
  <ellipse cx="76" cy="107" rx="24" ry="20" fill="#22d3ee" opacity="0.14"/>
  <!-- Eye glow halo right -->
  <ellipse cx="124" cy="107" rx="24" ry="20" fill="#22d3ee" opacity="0.14"/>

  <!-- Eye socket left -->
  <ellipse cx="76" cy="107" rx="18" ry="16" fill="#050e1b"/>
  <!-- Eye socket right -->
  <ellipse cx="124" cy="107" rx="18" ry="16" fill="#050e1b"/>

  <!-- Eye iris left -->
  <ellipse cx="76" cy="107" rx="14" ry="12.5" fill="url(#chimEyeL)"/>
  <!-- Eye iris right -->
  <ellipse cx="124" cy="107" rx="14" ry="12.5" fill="url(#chimEyeR)"/>

  <!-- Vertical slit pupil left -->
  <ellipse cx="76" cy="107" rx="4" ry="10.5" fill="#030912"/>
  <!-- Vertical slit pupil right -->
  <ellipse cx="124" cy="107" rx="4" ry="10.5" fill="#030912"/>

  <!-- Eye shine left -->
  <circle cx="82" cy="101" r="3.5" fill="white" opacity="0.92"/>
  <!-- Eye shine right -->
  <circle cx="130" cy="101" r="3.5" fill="white" opacity="0.92"/>
  <!-- Secondary shine left -->
  <circle cx="71" cy="113" r="1.5" fill="white" opacity="0.40"/>
  <!-- Secondary shine right -->
  <circle cx="119" cy="113" r="1.5" fill="white" opacity="0.40"/>

  <!-- Nose -->
  <path d="M97 126 L100 122 L103 126 Z" fill="#f0abcb" opacity="0.90"/>

  <!-- Mouth -->
  <path d="M95.5 128.5 Q100 132.5 104.5 128.5" stroke="#6b7280" stroke-width="1.2" fill="none" stroke-linecap="round"/>

  <!-- Whiskers left -->
  <line x1="18" y1="119" x2="86" y2="121.5" stroke="#2d3a4a" stroke-width="1.3" opacity="0.85"/>
  <line x1="16" y1="127" x2="84" y2="126.5" stroke="#2d3a4a" stroke-width="1.3" opacity="0.85"/>
  <!-- Whiskers right -->
  <line x1="114" y1="121.5" x2="182" y2="119" stroke="#2d3a4a" stroke-width="1.3" opacity="0.85"/>
  <line x1="116" y1="126.5" x2="184" y2="127" stroke="#2d3a4a" stroke-width="1.3" opacity="0.85"/>

  <!-- Collar band -->
  <path d="M58 154 Q100 167 142 154" stroke="#22d3ee" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Collar tag circle -->
  <circle cx="100" cy="163" r="11.5" fill="#050e1b" stroke="#22d3ee" stroke-width="1.6"/>
  <!-- Collar tag text HG -->
  <text x="100" y="168" text-anchor="middle" font-family="'Arial Narrow','Arial Black','Arial',sans-serif" font-size="8" font-weight="900" fill="#22d3ee" letter-spacing="0.8">HG</text>
</svg>
