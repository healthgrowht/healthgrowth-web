<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 224" fill="none" role="img" aria-label="Chimi — Asistente digital de Health Growth">
  <defs>
    <radialGradient id="cEyeL" cx="32%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#e0f9ff"/>
      <stop offset="35%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0c6b85"/>
    </radialGradient>
    <radialGradient id="cEyeR" cx="32%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#e0f9ff"/>
      <stop offset="35%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0c6b85"/>
    </radialGradient>
    <radialGradient id="cHead" cx="38%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#192741"/>
      <stop offset="100%" stop-color="#0b1322"/>
    </radialGradient>
    <radialGradient id="cGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient glow -->
  <ellipse cx="100" cy="152" rx="78" ry="64" fill="url(#cGlow)"/>

  <!-- Body -->
  <ellipse cx="100" cy="188" rx="52" ry="34" fill="#0c1322"/>
  <!-- Paws left -->
  <ellipse cx="72" cy="202" rx="20" ry="10" fill="#0c1322"/>
  <!-- Paws right -->
  <ellipse cx="128" cy="202" rx="20" ry="10" fill="#0c1322"/>
  <!-- Chest/belly lighter -->
  <ellipse cx="100" cy="179" rx="30" ry="22" fill="#121d31"/>

  <!-- Head -->
  <ellipse cx="100" cy="110" rx="64" ry="60" fill="url(#cHead)"/>

  <!-- Left ear — angular, cat-like -->
  <path d="M40 76 L29 26 L70 58 Z" fill="#0b1322"/>
  <path d="M43 72 L36 33 L67 57 Z" fill="#192741"/>
  <!-- Right ear -->
  <path d="M160 76 L171 26 L130 58 Z" fill="#0b1322"/>
  <path d="M157 72 L164 33 L133 57 Z" fill="#192741"/>

  <!-- Eye glow halos -->
  <ellipse cx="76" cy="107" rx="25" ry="22" fill="#22d3ee" opacity="0.11"/>
  <ellipse cx="124" cy="107" rx="25" ry="22" fill="#22d3ee" opacity="0.11"/>

  <!-- Eye outer ring -->
  <ellipse cx="76" cy="107" rx="19" ry="17" fill="#04090f"/>
  <ellipse cx="124" cy="107" rx="19" ry="17" fill="#04090f"/>

  <!-- Eye iris -->
  <ellipse cx="76" cy="107" rx="15" ry="13.5" fill="url(#cEyeL)"/>
  <ellipse cx="124" cy="107" rx="15" ry="13.5" fill="url(#cEyeR)"/>

  <!-- Vertical slit pupils -->
  <ellipse cx="76" cy="107" rx="4.5" ry="11.5" fill="#02060c"/>
  <ellipse cx="124" cy="107" rx="4.5" ry="11.5" fill="#02060c"/>

  <!-- Eye shine primary -->
  <circle cx="84" cy="99" r="4.2" fill="white" opacity="0.94"/>
  <circle cx="132" cy="99" r="4.2" fill="white" opacity="0.94"/>
  <!-- Eye shine secondary -->
  <circle cx="70" cy="114" r="2" fill="white" opacity="0.32"/>
  <circle cx="118" cy="114" r="2" fill="white" opacity="0.32"/>

  <!-- Nose -->
  <path d="M97.5 128 L100.5 123.5 L103.5 128 Z" fill="#f0abcb" opacity="0.88"/>

  <!-- Mouth -->
  <path d="M95.5 130 Q100.5 134.5 105.5 130" stroke="#4b5e72" stroke-width="1.1" fill="none" stroke-linecap="round"/>

  <!-- Whiskers left -->
  <line x1="12" y1="120" x2="86" y2="122.5" stroke="#1c2e42" stroke-width="1.4"/>
  <line x1="10" y1="129" x2="84" y2="128" stroke="#1c2e42" stroke-width="1.4"/>
  <!-- Whiskers right -->
  <line x1="114" y1="122.5" x2="188" y2="120" stroke="#1c2e42" stroke-width="1.4"/>
  <line x1="116" y1="128" x2="190" y2="129" stroke="#1c2e42" stroke-width="1.4"/>

  <!-- Collar band -->
  <path d="M54 158 Q100 174 146 158" stroke="#22d3ee" stroke-width="9" stroke-linecap="round" fill="none"/>

  <!-- Tag shadow -->
  <circle cx="101" cy="170" r="13" fill="#020810" opacity="0.5"/>
  <!-- Tag -->
  <circle cx="100" cy="168" r="13" fill="#060e1c" stroke="#22d3ee" stroke-width="1.8"/>
  <text x="100" y="174" text-anchor="middle" font-family="'Arial Black','Arial',sans-serif" font-size="8.5" font-weight="900" fill="#22d3ee" letter-spacing="0.5">HG</text>
</svg>
